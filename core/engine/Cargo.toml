[package]
name = "goox_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ropey = "1.6.1"
flutter_rust_bridge = "=2.11.1"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "40.0.0"
vte = "0.11"
