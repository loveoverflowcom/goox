[extension]
id = "windows-webview-sample"
name = "Windows WebView Sample"
version = "1.0.0"
description = "Minimal renderer extension for testing webview_all on Windows."
author = "Goox Team"
repository = "https://github.com/goox/extensions"
type = "renderer"

[extension.files]
types = ["wvtest"]

[webview]
entry = "webview/index.html"

[ui]
mode = "webview"
rendering = true

[protocol]
version = "erp/1"
capabilities = ["render.webview", "bridge.ping"]
