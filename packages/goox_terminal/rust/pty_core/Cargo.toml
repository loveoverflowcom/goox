[package]
name = "pty_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Rust core for PTY terminal operations"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "2.0"
portable-pty = "0.8"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
lazy_static = "1.4"
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[build-dependencies]
flutter_rust_bridge_codegen = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
