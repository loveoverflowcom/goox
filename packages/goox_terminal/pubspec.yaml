name: goox_terminal
description: PTY terminal support for Flutter via Rust FFI. Provides cross-platform pseudo-terminal functionality for running shell commands with interactive I/O.
version: 0.1.0
homepage: https://github.com/yourusername/goox_terminal

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
