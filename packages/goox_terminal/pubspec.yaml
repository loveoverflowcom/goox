name: goox_terminal
description: Flutter terminal session management backed by Rust PTY via flutter_rust_bridge.
version: 0.1.0
homepage: https://github.com/yourusername/goox_terminal

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_pty: ^0.4.2
  meta: ^1.10.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0


