<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goox Image Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      function encodeMessage(payload) {
        return typeof payload === 'string' ? payload : JSON.stringify(payload);
      }

      window.host = window.host || {
        postMessage(payload) {
          const message = encodeMessage(payload);
          try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
              window.chrome.webview.postMessage(message);
              return;
            }
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.host) {
              window.webkit.messageHandlers.host.postMessage(message);
              return;
            }
            if (window.external && window.external.invoke) {
              window.external.invoke(message);
            }
          } catch (error) {
            console.error('Goox host bridge failed', error);
          }
        },
      };
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <div>
        <div class="eyebrow">Goox extension</div>
        <h1 id="title">Image Viewer</h1>
      </div>
      <div class="toolbar__group">
        <button id="fitButton" class="button button--accent">Fit</button>
        <button id="oneToOneButton" class="button">1:1</button>
        <button id="zoomOut" class="button">-</button>
        <button id="zoomIn" class="button">+</button>
      </div>
      <div class="toolbar__group">
        <button id="resetButton" class="button">Reset</button>
      </div>
    </header>

    <section class="status">
      <span id="statusText">Waiting for file input...</span>
      <span id="sourceText" class="status__muted"></span>
    </section>

    <main class="viewer">
      <div id="viewport" class="viewer__viewport">
        <img id="image" alt="Extension preview" draggable="false" />
      </div>
      <div id="emptyState" class="empty-state">
        <div class="empty-state__card">
          <div class="eyebrow">Image renderer</div>
          <h2>Waiting for the host</h2>
          <p>The host will inject <code>window.__EXTENSION_INPUT__</code> with the file path and content.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="./main.js"></script>
</body>
</html>
