<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #toolbar {
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        #toolbar button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        #toolbar button:hover {
            background: #1177bb;
        }
        
        #info {
            color: #cccccc;
            font-size: 13px;
        }
        
        #viewer {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #2d2d30;
        }
        
        #imageContainer {
            position: relative;
            display: inline-block;
        }
        
        #image {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            image-rendering: auto;
        }
        
        #image.pixelated {
            image-rendering: pixelated;
        }
        
        #loading {
            text-align: center;
            padding: 40px;
            font-size: 14px;
            color: #858585;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="toolbar">
            <button id="zoomInBtn">Zoom In</button>
            <button id="zoomOutBtn">Zoom Out</button>
            <button id="resetBtn">Reset</button>
            <button id="pixelatedBtn">Toggle Pixelated</button>
            <span id="info"></span>
        </div>
        <div id="viewer">
            <div id="loading">Loading image...</div>
            <div id="imageContainer" style="display: none;">
                <img id="image" alt="Image preview">
            </div>
        </div>
    </div>

    <script>
        let currentZoom = 1.0;
        let isPixelated = false;
        let imageData = null;

        const image = document.getElementById('image');
        const imageContainer = document.getElementById('imageContainer');
        const loading = document.getElementById('loading');
        const info = document.getElementById('info');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pixelatedBtn = document.getElementById('pixelatedBtn');

        function updateZoom() {
            image.style.transform = `scale(${currentZoom})`;
            info.textContent = `${Math.round(currentZoom * 100)}%`;
        }

        zoomInBtn.addEventListener('click', () => {
            currentZoom = Math.min(currentZoom + 0.25, 5.0);
            updateZoom();
        });

        zoomOutBtn.addEventListener('click', () => {
            currentZoom = Math.max(currentZoom - 0.25, 0.25);
            updateZoom();
        });

        resetBtn.addEventListener('click', () => {
            currentZoom = 1.0;
            updateZoom();
        });

        pixelatedBtn.addEventListener('click', () => {
            isPixelated = !isPixelated;
            image.classList.toggle('pixelated', isPixelated);
        });

        // Listen for file content from Goox API
        if (window.gooxAPI) {
            window.gooxAPI.onFileContent((filePath) => {
                // For images, we can use the file path directly
                image.src = 'file://' + filePath;
                image.onload = () => {
                    loading.style.display = 'none';
                    imageContainer.style.display = 'inline-block';
                    info.textContent = `${image.naturalWidth} × ${image.naturalHeight} | 100%`;
                };
                image.onerror = () => {
                    loading.textContent = 'Error loading image';
                };
            });

            // Request file path
            window.gooxAPI.requestFileContent();
        } else {
            loading.textContent = 'Goox API not available';
        }
    </script>
</body>
</html>
