name: goox
description: "Architecture-first Flutter shell for the goox editor demo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: ^2.11.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  path: ^1.9.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^11.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
